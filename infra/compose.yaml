services:
  android:
    image: redroid/redroid:11.0.0-latest
    container_name: android-web-emulator-android11
    privileged: true
    restart: unless-stopped
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
    volumes:
      - android11-data:/data
    expose:
      - "5555"
    networks:
      - android-private
    # ADB fica apenas na rede Docker. Nunca publique a porta 5555.

  api:
    build:
      context: ../server
    container_name: android-web-emulator-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANDROID_ADB_HOST: android
      ANDROID_ADB_PORT: "5555"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - android
    networks:
      - android-private

volumes:
  android11-data:

networks:
  android-private:
    driver: bridge
